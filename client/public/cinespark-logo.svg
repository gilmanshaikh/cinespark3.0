<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#3DD6C6"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#080C15"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="36" fill="url(#panel)"/>

  <g transform="translate(70 70)">
    <rect x="0" y="18" width="210" height="210" rx="42" fill="#0E1728" stroke="rgba(61,214,198,0.35)" stroke-width="2"/>
    <circle cx="105" cy="123" r="64" stroke="url(#accentGlow)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <circle cx="105" cy="123" r="86" stroke="url(#accentGlow)" stroke-width="2" opacity="0.25"/>
    <path d="M89 96L131 123L89 150V96Z" fill="url(#accentGlow)" filter="url(#softGlow)"/>
    <path d="M52 78H86" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M164 78H170" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M82 170H126" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M102 45V62" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M102 184V201" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <rect x="70" y="190" width="70" height="20" rx="10" fill="rgba(61,214,198,0.15)" stroke="rgba(61,214,198,0.4)"/>
    <circle cx="80" cy="200" r="4" fill="#3DD6C6"/>
  </g>

  <g transform="translate(340 100)">
    <text x="0" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="-3" fill="#EAF7FF">Cine</text>
    <text x="260" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="-3" fill="url(#accentGlow)">Spark</text>
    <text x="655" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="url(#accentGlow)">3.0</text>

    <line x1="6" y1="120" x2="640" y2="120" stroke="rgba(61,214,198,0.28)" stroke-width="2"/>

    <text x="0" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94A3B8">TECHNICAL STORY CHALLENGE</text>
    <text x="0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2" fill="#CBD5E1">Create • Decode • Capture • Compete</text>
  </g>
</svg>
