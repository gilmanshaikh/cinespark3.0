<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="0.5" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#040910"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9E7"/>
      <stop offset="0.45" stop-color="#3DD6C6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112136"/>
      <stop offset="1" stop-color="#0B101A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g transform="translate(80 80)">
    <rect x="0" y="0" width="260" height="260" rx="52" fill="url(#panel)" stroke="rgba(61,214,198,0.45)" stroke-width="2"/>
    <circle cx="130" cy="130" r="78" stroke="url(#teal)" stroke-width="9" opacity="0.95"/>
    <circle cx="130" cy="130" r="108" stroke="url(#teal)" stroke-width="2" opacity="0.3"/>
    <path d="M109 92L171 130L109 168V92Z" fill="url(#teal)" filter="url(#glow)"/>
    <path d="M58 70H90" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M170 70H192" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M84 187H176" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M130 38V56" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M130 204V222" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
    <rect x="76" y="218" width="108" height="21" rx="10.5" fill="rgba(125,243,232,0.08)" stroke="rgba(125,243,232,0.45)"/>
    <circle cx="94" cy="229" r="5" fill="#7DF9E7"/>
  </g>

  <g transform="translate(410 118)">
    <text x="0" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="100" font-weight="900" letter-spacing="-4" fill="#F8FBFF">Cine</text>
    <text x="312" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="100" font-weight="900" letter-spacing="-4" fill="url(#teal)">Spark</text>
    <text x="770" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="4" fill="#8FEAD8">3.0</text>

    <line x1="6" y1="160" x2="760" y2="160" stroke="rgba(61,214,198,0.35)" stroke-width="2"/>

    <text x="0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#9DB7C8">TECHNICAL STORY CHALLENGE</text>
    <text x="0" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#DCE6F4">Create • Decode • Capture • Compete</text>
  </g>
</svg>
