name: Deploy CineSpark to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm install

      - name: Build frontend
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinespark-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinespark-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cinespark || git clone https://github.com/${{ github.repository }}.git /home/ubuntu/cinespark
            cd /home/ubuntu/cinespark
            git pull origin main

            cat > .env <<'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            EOF

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinespark-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinespark-frontend:latest
            docker compose down || true
            docker compose up -d --force-recreate --remove-orphans
            docker compose ps
            docker compose logs --tail=50
